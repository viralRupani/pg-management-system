# Production Postgres + Redis for a single-box deploy.
#
# Hardened variant of infra/docker-compose.yml:
#   - ports bound to 127.0.0.1 ONLY (never reachable from the public internet;
#     the API talks to them over localhost, Caddy is the only public listener)
#   - superuser password comes from an env file, not a literal
#   - Redis persists (appendonly) so a restart doesn't drop in-flight OTPs
#   - both services keep their data in named volumes and restart on boot
#
# Reads variables from `deploy/.env` (docker compose's default env file). Create it:
#   POSTGRES_PASSWORD=<a long random string>   # openssl rand -hex 24
#   TZ=Asia/Kolkata
#
# Bring up:   docker compose -f deploy/docker-compose.prod.yml up -d
# Migrations, roles, and app connection strings: see docs/PRODUCTION.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: basera_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: pg_management
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      # localhost only — NOT 0.0.0.0. Standard 5432 (no dev-machine conflict here).
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Creates app_user (NOBYPASSRLS) + platform_user (BYPASSRLS) on FIRST init
      # only. Reused from the repo's single source of truth for the role model.
      - ../infra/init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_management"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: basera_redis
    restart: unless-stopped
    # appendonly = survive restarts (OTPs, reset tokens, BullMQ job state).
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  redis_data:
