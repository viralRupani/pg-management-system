# nginx config for Basera — reverse-proxy for the API + static hosting for the
# two web frontends. TLS is obtained/renewed by certbot's nginx plugin (not
# built into nginx itself, unlike Caddy).
#
# Install:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/basera
#   sudo nano /etc/nginx/sites-available/basera   # replace the 3 domains below
#   sudo ln -s /etc/nginx/sites-available/basera /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # Point each subdomain's DNS A record at this box FIRST, then issue certs —
#   # certbot edits this file in place to add the 443 server blocks + HTTP->HTTPS
#   # redirect, and installs a systemd timer that renews automatically:
#   sudo certbot --nginx -d api.basera.app -d admin.basera.app -d app.basera.app
#   sudo systemctl status certbot.timer       # confirm auto-renew is scheduled
#
# nginx listens on 80/443 (the only public ports).

# ---- API ------------------------------------------------------------------
server {
	listen 80;
	listen [::]:80;
	server_name api.basera.app;

	gzip on;

	location / {
		proxy_pass http://127.0.0.1:4000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# The API sets its own CORS (from CORS_ORIGINS); these are transport headers.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	server_tokens off;
}

# ---- Admin dashboard (static export -> apps/admin/out) ---------------------
server {
	listen 80;
	listen [::]:80;
	server_name admin.basera.app;

	root /var/www/admin;
	index index.html;
	gzip on;

	# Static export uses trailingSlash:true (/foo -> /foo/index.html); this
	# resolves clean URLs to the exported directory index, same as Caddy's
	# try_files {path} {path}/ /index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	server_tokens off;
}

# ---- Resident web app / PWA (static export -> apps/resident-web/out) -------
server {
	listen 80;
	listen [::]:80;
	server_name app.basera.app;

	root /var/www/resident;
	index index.html;
	gzip on;

	location / {
		try_files $uri $uri/ /index.html;
	}

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	server_tokens off;
}

# ---- (Optional) landing site on the root domain -----------------------------
